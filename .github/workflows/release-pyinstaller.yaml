name: Release binaries

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash
        working-directory: src

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --only main

      - name: Build with PyInstaller
        run: poetry run pyinstaller --noconfirm dolt_annex.spec

      - name: Archive bundle
        run: |
          set -e
          name="dolt_annex-${RUNNER_OS,,}-${RUNNER_ARCH,,}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a "../$name.zip" ./*)
          else
            tar -czf "$name.tar.gz" -C dist .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolt_annex-${{ runner.os }}-${{ runner.arch }}
          path: src/dolt_annex-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" bundles/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
